<svg width="420" height="120" viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CircuitLab AI Logo</title>
  <desc id="desc">A modern electronics inspired logo with circuit traces and CircuitLab AI wordmark.</desc>
  <defs>
    <linearGradient id="chipGrad" x1="14" y1="12" x2="106" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#2E6BFF"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="138" y1="30" x2="390" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F4FF"/>
      <stop offset="1" stop-color="#8FB6FF"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="104" height="104" rx="24" fill="#07152A"/>
  <rect x="20" y="20" width="80" height="80" rx="18" fill="url(#chipGrad)"/>

  <path d="M34 60H54" stroke="#07213F" stroke-width="6" stroke-linecap="round"/>
