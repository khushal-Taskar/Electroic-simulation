  <path d="M112 40H124" stroke="#2E6BFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M112 80H124" stroke="#2E6BFF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="8" cy="40" r="4" fill="#00D9FF"/>
  <circle cx="8" cy="80" r="4" fill="#00D9FF"/>
  <circle cx="124" cy="40" r="4" fill="#2E6BFF"/>
  <circle cx="124" cy="80" r="4" fill="#2E6BFF"/>

  <text x="138" y="58" fill="url(#textGrad)" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="0.5">CircuitLab</text>
  <text x="138" y="92" fill="#00D9FF" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">AI</text>
